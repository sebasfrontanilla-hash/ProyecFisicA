# setup-project.ps1 - Configura proyecto Python completo
Write-Host " Configurando proyecto..." -ForegroundColor Green

# Crear estructura
@("src/app", "tests", ".github/workflows") | ForEach-Object { New-Item -ItemType Directory -Path $_ -Force | Out-Null }

# pyproject.toml
@"
[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Dev <dev@email.com>"]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.12.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--cov=src", "--cov-report=term"]
"@ | Out-File pyproject.toml -Encoding utf8

# GitHub Actions
@"
name: PR Tests
on: [pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install poetry
    - run: poetry install
    - run: poetry run pytest
"@ | Out-File .github/workflows/test.yml -Encoding utf8

# Código ejemplo
@"
def sumar(a, b):
    return a + b

def dividir(a, b):
    if b == 0:
        raise ValueError("División por cero")
    return a / b
"@ | Out-File src/app/calc.py -Encoding utf8

# Tests
@"
import pytest
from app.calc import sumar, dividir

def test_sumar():
    assert sumar(2, 3) == 5

def test_dividir():
    assert dividir(10, 2) == 5

def test_dividir_por_cero():
    with pytest.raises(ValueError):
        dividir(10, 0)
"@ | Out-File tests/test_calc.py -Encoding utf8

# __init__.py
"" | Out-File src/app/__init__.py -Encoding utf8
"" | Out-File tests/__init__.py -Encoding utf8

# .gitignore
@"
__pycache__/
*.pyc
.venv/
.pytest_cache/
.coverage
htmlcov/
"@ | Out-File .gitignore -Encoding utf8

# README
@"
# Proyecto Python

## Instalar
``````powershell
poetry install
``````

## Tests
``````powershell
poetry run pytest
``````
"@ | Out-File README.md -Encoding utf8

# Instalar Poetry si no existe
if (-not (Get-Command poetry -ErrorAction SilentlyContinue)) {
    Write-Host "Instalando Poetry..." -ForegroundColor Yellow
    (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | python -
    $env:PATH += ";$env:APPDATA\Python\Scripts"
}

# Instalar dependencias
Write-Host "Instalando dependencias..." -ForegroundColor Cyan
poetry install

Write-Host "`n ¡Listo! Ejecuta: poetry run pytest" -ForegroundColor Green